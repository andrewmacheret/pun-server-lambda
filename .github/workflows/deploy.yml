name: Test and deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '**.markdown'
      - '.github/workflows/canary.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FUNCTION_NAME: Pun
  RUNTIME: provided.al2023

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/lambda/go.mod
          cache: false
      - run: go vet ./... && go test -v ./...
        working-directory: src/lambda

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/lambda/go.mod
          cache: false
      # The provided.al2023 runtime runs a file named bootstrap. puns.txt is built into it.
      - name: Build
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags=-s -o bootstrap .
          zip -j ../../lambda.zip bootstrap
        working-directory: src/lambda
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # AWS blocks code updates on old runtimes, so set the runtime first
      - name: Update runtime and settings
        run: |
          aws lambda update-function-configuration --function-name "$FUNCTION_NAME" \
            --runtime "$RUNTIME" --handler bootstrap --timeout 3 --memory-size 128 \
            --output text --query LastUpdateStatus
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
      - name: Update code
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip --architectures arm64 \
            --output text --query LastUpdateStatus
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
      - name: Smoke test
        run: |
          curl -sSf -H 'Accept: application/json' https://pun.andrewmacheret.com/ | tee /dev/stderr | jq -e '.pun'
          curl -sSf -H 'Accept: text/plain' https://pun.andrewmacheret.com/
          curl -sSf https://pun.andrewmacheret.com/healthcheck | jq -e '.status == "ok"'
